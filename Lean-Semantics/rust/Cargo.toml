[package]
name = "lumiris"
version = "0.1.0"
edition = "2021"
description = "Lumiris: a verified physics+math compiler core for photonic and memristive hardware"
 
[dependencies]
z3 = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
 
[[bin]]
name = "lumiris"
path = "src/main.rs"