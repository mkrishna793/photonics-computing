name: Verify Lumiris
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  executable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Rust formatting
        run: cargo fmt --manifest-path Lean-Semantics/rust/Cargo.toml -- --check
      - name: Run test suite
        run: scripts/test.sh
      - name: Run MZI demonstration
        run: scripts/demo.sh artifacts/mzi-demo
      - uses: actions/upload-artifact@v4
        with:
          name: mzi-demonstration
          path: artifacts/mzi-demo
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean-Semantics/lean
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Lean demonstration verification
        run: scripts/demo.sh artifacts/mzi-demo --lean
