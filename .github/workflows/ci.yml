name: Verify Lumiris
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  executable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --manifest-path Lean-Semantics/rust/Cargo.toml -- --check
      - run: scripts/test.sh
      - run: scripts/demo.sh artifacts/mzi-demo
      - uses: actions/upload-artifact@v4
        with:
          name: mzi-demonstration
          path: artifacts/mzi-demo
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean-Semantics/lean
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: scripts/demo.sh artifacts/mzi-demo --lean
