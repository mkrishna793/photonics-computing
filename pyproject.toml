[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "photonics-computing"
version = "0.1.0"
description = "High-performance photonic computing & optical tensor acceleration engine powered by Prime Agent RLM and PRAXIST Lineage"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Photonics Computing R&D" }
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "sympy>=1.12.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
